# Publishes the website to GitHub Pages (the gh-pages branch) on every push
# to MASTER, or by hand from the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   VITE_CLIENT_URL     - the server, e.g. https://demacia-bom-app-n2ag.onrender.com
#   VITE_CLIENT_SECRET  - the client secret the server expects
name: Deploy website to GitHub Pages

on:
  push:
    branches: [MASTER]
    # Pushes that only change the server (deployed by Render), docs, update logs
    # or release notes (publish/) don't change the website: no redeploy.
    paths-ignore:
      - 'server/**'
      - '**/*.md'
      - 'publish/**'
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

# Never run two deploys at once; a newer push replaces a waiting one.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # the build tool (Vite 8) needs Node 20.19+ / 22.12+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          VITE_CLIENT_URL: ${{ secrets.VITE_CLIENT_URL }}
          VITE_CLIENT_SECRET: ${{ secrets.VITE_CLIENT_SECRET }}
        run: npm run build

      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -m "Deploy ${GITHUB_SHA}"
